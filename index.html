<style>
:root{
  /* 默认深色（参考 Linear）：克制的灰阶，只给“已走的路”和 AI 解读上色 */
  --bg:#0b0b0d; --card:#111114; --card2:#16161a; --ink:#ededf0; --soft:#8b8b95; --faint:#5c5c66; --line:#22222a; --flow:#17171c;
  --goal:#6e9bff; --ai:#a99bff; --b1:#6e9bff; --b2:#3ddc97; --b3:#ff9f5a; --b4:#8b8b95;
  --on:#3ddc97; --slow:#ffb454; --off:#ff6b6b; --na:#8b8b95; --shadow:rgba(0,0,0,.55);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f8fafc; --card:#ffffff; --card2:#f8fafc; --ink:#0f172a; --soft:#64748b; --faint:#94a3b8; --line:#e5e7eb; --flow:#edf1f6;
  --goal:#2563eb; --ai:#4f46e5; --b1:#2563eb; --b2:#0f9f7f; --b3:#ea580c; --b4:#94a3b8;
  --on:#16a34a; --slow:#d97706; --off:#dc2626; --na:#94a3b8; --shadow:rgba(15,23,42,.16); color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f8fafc; --card:#ffffff; --card2:#f8fafc; --ink:#0f172a; --soft:#64748b; --faint:#94a3b8; --line:#e5e7eb; --flow:#edf1f6;
  --goal:#2563eb; --ai:#4f46e5; --b1:#2563eb; --b2:#0f9f7f; --b3:#ea580c; --b4:#94a3b8;
  --on:#16a34a; --slow:#d97706; --off:#dc2626; --na:#94a3b8; --shadow:rgba(15,23,42,.16); color-scheme:light}}
:root:lang(ja){--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
:root:lang(ko){--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--goal);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--goal);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding:22px 32px 96px;position:relative;isolation:isolate}
html,body{overflow-x:clip}
.crumb{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft);margin-bottom:28px}
.crumb b{color:var(--ink)}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--on);background:color-mix(in srgb,var(--on) 10%,transparent);border-radius:99px;padding:4px 12px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--on);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--on) 55%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.theme{border:0;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--soft);cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start;margin-top:26px}
.card{background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line)}
.mapcard{padding:14px 18px 10px;min-width:0}
.rail{display:grid;gap:16px}
.ai{padding:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--ai) 13%,var(--card)),var(--card) 70%);box-shadow:0 0 0 1px color-mix(in srgb,var(--ai) 30%,transparent)}
.aih{display:flex;align-items:center;gap:8px}
.aih b{font-size:13.5px;color:var(--ai)}
.aih svg{display:block}
.aih small{margin-left:auto;font-size:11.5px;color:var(--soft)}
.pts{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.pts li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14.5px;line-height:1.7}
.pts li>span:first-child{font-size:12px;font-weight:700;color:var(--ai);padding-top:3px}
.ref{display:inline-flex;align-items:center;height:19px;border:0;border-radius:6px;padding:0 6px;margin:0 2px;font-size:11.5px;font-weight:600;line-height:19px;color:var(--ai);background:color-mix(in srgb,var(--ai) 14%,transparent);cursor:pointer;vertical-align:1px}
.ref:hover{background:color-mix(in srgb,var(--ai) 26%,transparent)}
.you{margin-top:14px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--ai) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ai) 22%,transparent)}
.you b{display:block;font-size:12.5px;color:var(--ai);margin-bottom:4px}
.you p{margin:0;font-size:14px;line-height:1.7}
.aif{margin-top:12px;font-size:11.5px;color:var(--faint)}
.since{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--goal);background:var(--card);border-radius:12px;padding:12px 16px;margin:0 0 18px;font-size:14px}
.since b{white-space:nowrap}.since ul{margin:4px 0 0;padding-left:18px}.since li{margin:2px 0}.since .x2{margin-left:auto;border:0;background:none;color:var(--soft);cursor:pointer;font-size:18px;line-height:1}
.who.newdot::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--goal);margin:-2px 0 0 -4px}
.pl{padding:6px 18px 14px}.pl .psum{font-size:14px;color:var(--soft);margin:4px 0 14px}
.pl table{width:100%;border-collapse:collapse;font-size:13.5px}.pl th{text-align:left;font-weight:600;color:var(--soft);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.pl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.pl td.rate b{font-size:15px}
.ps{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.ps.kept{background:color-mix(in srgb,var(--on) 18%,transparent);color:var(--on)}.ps.late{background:color-mix(in srgb,var(--slow) 20%,transparent);color:var(--slow)}
.ps.broken{background:color-mix(in srgb,var(--off) 18%,transparent);color:var(--off)}.ps.pending,.ps.unclear{background:var(--card2);color:var(--soft)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:10px}.plist li{font-size:13.5px}.plist .pm{color:var(--soft);font-size:12px;margin-top:2px}
.plist q{display:block;font-size:12.5px;color:var(--soft);margin-top:3px;font-style:italic}.plist .oc{margin-top:4px;font-size:13px}
.act{padding:6px 18px 14px}.act table{width:100%;border-collapse:collapse;font-size:13.5px}.act th{text-align:left;font-weight:600;color:var(--soft);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.act td{padding:7px 8px;border-bottom:1px solid var(--line)}.act svg{display:block}.act .anote{font-size:12px;color:var(--faint);margin-top:10px}
.gaps{margin:10px 0 4px}.gaps ul{margin:4px 0 6px;padding-left:18px;font-size:13.5px}.gaps .gf b,.gaps .go b{font-size:12.5px}.gaps .go{border-left:3px solid var(--line);padding-left:10px;margin-top:6px}.gaps .go small{color:var(--faint);font-size:11.5px}
.pick{font-size:12.5px;color:var(--soft);margin:4px 0}
.grades{margin:14px 0}.gbar2{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;max-width:520px}.gbar2 i,.gk i{display:inline-block}.gA{background:#16a34a}.gB{background:#65a30d}.gC{background:#ca8a04}.gD{background:#9ca3af}
.gk{font-size:12.5px;margin-right:12px;white-space:nowrap}.gk i{width:9px;height:9px;border-radius:2px;margin-right:4px}.gnote{font-size:12px;color:var(--faint)}
.pubonly{font-size:13px;color:var(--soft);border-left:3px solid var(--goal);padding-left:10px}
.qbar{flex-direction:column;align-items:flex-start}.rdet summary{cursor:pointer;font-size:13px}.sb #dh,.sb #comph,.sb .comp>.ch>small{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tierbox .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.tierbox .tab{border:1px solid var(--line,#ddd);background:transparent;color:inherit;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}.tierbox .tab[aria-selected=true]{background:var(--ink);color:var(--bg,#fff)}.tierbox .tnote{font-size:13px;color:var(--soft);margin:0 0 10px;line-height:1.7}.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.wcard{border:1px solid var(--line,#e5e5e5);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;border-left:3px solid var(--c,var(--faint))}.wcard b{font-size:13.5px}.wcard .rs{display:inline-block;font-size:11.5px;border:1px dashed var(--soft);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--soft)}.wcard p{margin:4px 0;color:var(--soft)}.wcard small{color:var(--faint)}.wbr{margin:14px 0 6px;font-size:13px;font-weight:600}.ltab{width:100%;border-collapse:collapse;font-size:13px}.ltab td,.ltab th{padding:6px 6px;border-bottom:1px solid var(--line,#eee);text-align:left;vertical-align:top}.ltab .uv{font-size:11.5px;color:var(--off)}.tiers3{display:grid;gap:8px;margin:10px 0}.tiers3 div{border:1px solid var(--line,#e5e5e5);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.7}.tiers3 b{display:block}.tiernote{font-size:12.5px;color:var(--soft);margin:8px 0 0}
.roster{margin:10px 0 0;font-size:13px}.roster ul{columns:2;padding-left:18px}.roster small{color:var(--soft)}
.human{margin:14px 0}.hbtn{border:1px solid var(--goal);background:transparent;color:var(--goal);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.hlist{max-width:1080px;margin:10px auto;padding-left:22px;display:grid;gap:14px}.hrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}.hg{font-size:12px;color:var(--soft)}.hc{margin:6px 0;font-size:14px}
.hv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.hv button{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}.hv button.on{background:var(--goal);color:#fff;border-color:var(--goal)}.hn{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--card);color:var(--ink)}
.rpt{border:0;background:none;color:var(--faint);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0 2px}.rpt:hover{color:var(--off)}
.rptbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:13px;background:var(--card2);display:grid;gap:6px}.rptbox textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card);color:var(--ink)}.rptbox .rq{margin:0;color:var(--soft)}.rb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rb small{color:var(--faint)}
.rsend{background:var(--goal);color:#fff;border:0;border-radius:999px;padding:5px 14px;cursor:pointer}.rcancel{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.indep ul{font-size:13px;color:var(--soft);padding-left:18px}.indep li{margin:3px 0}
.spark{color:var(--goal)}
.cmp{padding:4px 0 6px}.cmp table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}.cmp th{text-align:left;font-size:12px;color:var(--soft);padding:6px 8px;border-bottom:1px solid var(--line)}.cmp th:last-child,.cmp td:last-child{color:var(--ink);font-weight:600}
.cmp td{padding:7px 8px;border-bottom:1px solid var(--line)}.cmp td small{color:var(--soft);font-weight:400}.cnote{font-size:12.5px;color:var(--soft);margin:10px 0 0;padding-left:18px}.cnote li{margin:3px 0}
.chg{padding:6px 18px 12px}
.chg h2{font-size:14px;margin:12px 0 4px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
h1{margin:0;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.goalline{margin:12px 0 0;font-size:16.5px;color:var(--soft)}
.goalline b{color:var(--ink);font-weight:600}
.stats{display:flex;gap:36px}
.stat b{display:block;font-size:36px;line-height:1;font-weight:700;letter-spacing:-.02em}
.stat span{display:block;margin-top:8px;font-size:13px;color:var(--soft)}
.stat.hi b{color:var(--goal)}
.meta{margin-top:10px;font-size:13px;color:var(--soft)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 4px}
.pill{display:flex;align-items:center;gap:8px;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:6px 14px 6px 10px;cursor:pointer;font-size:14px;transition:box-shadow .15s,opacity .15s}
.pill i{width:22px;height:3px;border-radius:2px;background:var(--c)}
.pill small{color:var(--soft);font-size:12.5px}
.pill[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c)}
.bar.focus .pill[aria-pressed="false"]{opacity:.45}
.key{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--soft)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key svg{display:block}

.mapbox{overflow-x:auto;margin:4px 0 0}
svg.map{display:block;width:100%;min-width:820px;height:auto}
svg.map.fan{min-width:640px;max-height:980px;margin:0 auto}
svg text{font-family:var(--font)}
.who{cursor:pointer}
.pulse{transform-box:fill-box;transform-origin:center;animation:gp 3.2s ease-out infinite}
@keyframes gp{0%{transform:scale(.75);opacity:.6}100%{transform:scale(2.1);opacity:0}}
.fan .who.on .walk{stroke-width:3.4}.fan .who.on .lab{font-weight:700}
.who .walk,.who .rest,.who .lab,.who .dot{transition:opacity .15s,stroke-width .15s}
.map.hov .who:not(.on){opacity:.16}
.map.filt .who:not(.sel),.map.filt .blab:not(.sel){opacity:.1}
.who.on .walk{stroke-width:4}
.who.on .lab{font-weight:700}
.who:focus{outline:none}
.who:focus .dot{stroke-width:3.2}

.tip{position:fixed;z-index:20;width:350px;overflow:auto;overscroll-behavior:contain;max-width:calc(100vw - 24px);background:var(--card);border-radius:18px;
  box-shadow:0 24px 60px var(--shadow),0 0 0 1px var(--line);padding:18px 18px 16px;font-size:13.5px;line-height:1.55;display:none;pointer-events:none}
.tip.pinned{pointer-events:auto}
.tip.show{display:block}
.tip .xx{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:0;background:var(--flow);color:var(--soft);font-size:16px;line-height:28px;cursor:pointer;display:none}
.tip.pinned .x{display:block}
.lp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c)}
.lp i{width:18px;height:3px;border-radius:2px;background:var(--c)}
.tip h3{margin:6px 0 0;font-size:20px;line-height:1.25;font-weight:700;letter-spacing:-.01em;padding-right:30px}
.where{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.where b{font-size:32px;line-height:1;font-weight:700;color:var(--c);letter-spacing:-.02em}
.where span{font-size:14px;font-weight:600}
.where em{margin-left:auto;font-style:normal;font-size:13px;color:var(--soft)}
.seg{display:grid;grid-template-columns:repeat(6,1fr) 12px;gap:4px;align-items:center;margin:12px 0 2px}
.seg span{height:6px;border-radius:3px;background:var(--line)}
.seg span.f{background:var(--c)}
.seg em{height:14px;border-left:2px solid var(--goal)}
.ms{margin:12px 0 0;font-size:14px;font-weight:500}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{display:grid}
.facts small{font-size:11.5px;color:var(--soft)}
.facts strong{font-size:13.5px;font-weight:600}
.flags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.flags span{font-size:12px;font-weight:500;color:var(--off);background:color-mix(in srgb,var(--off) 10%,transparent);border-radius:6px;padding:1px 8px}
.ev{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;font-size:12.5px}
.ev li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.g{font-size:11px;font-weight:700;text-align:center;border-radius:5px;height:18px;line-height:18px;background:var(--flow);color:var(--soft)}
.g-A{background:var(--goal);color:#fff}.g-B{background:color-mix(in srgb,var(--goal) 14%,transparent);color:var(--goal)}
.ev .d{color:var(--soft);margin-right:5px}
.tip .note{margin-top:10px;font-size:12.5px;color:var(--slow)}
.tip .more{margin-top:10px;font-size:12px;color:var(--soft)}
.tip.pinned .more{display:none}

.hero{margin:6px 0 0;font-size:44px;line-height:1.15;font-weight:700;letter-spacing:-.025em;max-width:16em}
.hero em{font-style:normal;background:linear-gradient(90deg,var(--ai),var(--goal));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:13px;font-weight:600;color:var(--soft);letter-spacing:.02em}
.glow{position:absolute;inset:-200px 0 auto auto;width:760px;height:520px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ai) 18%,transparent),transparent);pointer-events:none;z-index:-1}
.distrib{display:flex;gap:3px;margin-top:18px;max-width:560px}
.distrib div{flex:1;display:grid;gap:6px}
.distrib i{height:6px;border-radius:3px;background:var(--line)}
.distrib i.f{background:var(--goal)}
.distrib small{font-size:11.5px;color:var(--soft)}
.distrib b{color:var(--ink);font-weight:700}
.flowing{stroke-dasharray:3 9;animation:drift 1.6s linear infinite}
@keyframes drift{to{stroke-dashoffset:-12}}
.mlist{display:none}
.chg .more3{display:inline-block;margin-top:12px;font-size:13px;color:var(--soft);border:0;background:none;cursor:pointer;padding:0}
.comp{margin-top:20px;padding:20px 22px}

@media (max-width:1180px){.grid{grid-template-columns:1fr}.rail{grid-template-columns:1fr 1fr}}

/* 居中版式：标题居中，地图全宽，下方三栏 */

/* ---- 竖向分区 ---- */
.secs{max-width:1180px;margin:64px auto 0;position:relative}

@media (max-width:900px){.sec{grid-template-columns:1fr;gap:16px;padding:32px 0}.sh{position:static}.sh p{max-width:none}.sb .donut{grid-template-columns:1fr;justify-items:center}}
/* ---- 目标可改 ---- */
.goalline{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:8px 10px}

.gedit:hover{background:color-mix(in srgb,var(--goal) 18%,transparent)}
.gtag{flex-basis:100%;font-size:12px;color:var(--ai)}

/* ---- 想法 ---- */
.ideas{display:grid;gap:14px}

/* ---- 底部输入框 ---- */

<script>
/* ---------- 语言：默认英文，可切中文；数据里的中文经 data/en.json 翻成英文 ---------- */
const LANGS=[["en","English","en-US","EN"],["zh","简体中文","zh-CN","中"],["ja","日本語","ja-JP","日"],["ko","한국어","ko-KR","한"],["es","Español","es-ES","ES"],["fr","Français","fr-FR","FR"],["de","Deutsch","de-DE","DE"],["pt","Português","pt-BR","PT"]];

let LANG=(()=>{try{const q=new URLSearchParams(location.search).get("lang");if(LCODES.includes(q))return q;const v=localStorage.getItem("vm-lang");if(LCODES.includes(v))return v;for(const n of (navigator.languages||[navigator.language||""])){const c=String(n).toLowerCase().split("-")[0];if(LCODES.includes(c))return c}}catch(_){}return "en"})();

let EN={}, XL={}, XP=null; const XC=new Map();
/* 其他语言：以英文为源，查 data/i18n/<语言>.json；带 {0} 的键是句式模板 */
function X(s){ if(LANG==="en"||LANG==="zh"||typeof s!=="string"||!s) return s; const v=XL[s]; if(v!=null) return v;
  if(XC.has(s)) return XC.get(s);
  if(!XP) XP=Object.keys(XL).filter(k=>/\{\d\}/.test(k)).map(k=>{const parts=k.split(/\{(\d)\}/); let re="^"; const idx=[]; parts.forEach((q,i)=>{ if(i%2){re+="([\\s\\S]*?)"; idx.push(+q)} else re+=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") }); return [new RegExp(re+"$"),idx,XL[k]] });
  let out=s; for(const [re,idx,t] of XP){ const m=s.match(re); if(m){ out=t.replace(/\{(\d)\}/g,(_,n)=>{const j=idx.indexOf(+n); return j>=0?m[j+1]:""}); break } }
  XC.set(s,out); return out; }
async function loadXL(){ XC.clear(); XP=null; XL={}; if(LANG==="en"||LANG==="zh") return; const r=await getJ(`data/i18n/${LANG}.json`,{}); XL=r&&typeof r==="object"?r:{}; }
const BRAND_ZH="先瞰";
const L=(zh,en)=>LANG==="zh"?zh:LANG==="en"?en:X(en);
const tx=s=>LANG==="zh"||typeof s!=="string"?s:X(EN[s]??s);
const STAGE_ZH={S0:"提出",S1:"部分进展",S2:"宣称完成",S3:"验证中",S4:"公认",S5:"巩固"};

const KIND={created:["建立","Created","var(--faint)"],new:["新玩家","New player","var(--on)"],stage:["阶段变化","Stage change","var(--goal)"],milestone:["新里程碑","New milestone","var(--slow)"],bad:["坏消息","Setback","var(--off)"],activity:["活跃度变化","Activity change","var(--slow)"],promote:["升入主图","Moved to main map","var(--on)"],demote:["移出主图","Moved off main map","var(--off)"],watch:["进观察名单","Added to watch list","var(--b3)"]};

const LC0={biped:"var(--b1)",wheeled:"var(--b2)",service:"var(--b3)",adjacent:"var(--b4)"}, LCP=["var(--b1)","var(--b2)","var(--b3)","#a855f7","#0ea5e9","#e11d48"];
// 其他地图的路线没有固定颜色：按它在 branches 里的顺序取色，相邻方向固定灰色
const LC=new Proxy(LC0,{get:(t,k)=>{ if(typeof k!=="string") return undefined; if(k==="adjacent") return t.adjacent;
  const bs=((typeof D!=="undefined"&&D&&D.project&&D.project.branches)||[]).filter(b=>b.id!=="adjacent"), i=bs.findIndex(b=>b.id===k);
  return (bs.some(b=>b.id in t)&&t[k])||(i>=0?LCP[i%LCP.length]:t[k]); }});

const TGT=d=>Math.min(5,Math.max(1,+String((d&&d.project&&d.project.target_stage)||"S2").slice(1)||2));
const isOn=e=>String(e.activity||"").startsWith("活跃");
const actC=a=>!a?"var(--na)":a.startsWith("活跃")?"var(--on)":a.startsWith("放缓")?"var(--slow)":(a.startsWith("停滞")||a.startsWith("已放弃"))?"var(--off)":"var(--na)";
const short0=n=>{const t=String(n).replace(/（.*?）|\(.*?\)/g,"").trim();let w=0,o="";for(const ch of t){w+=/[\u0000-ɏ]/.test(ch)?.58:1;if(w>10.5)return o.trimEnd()+"…";o+=ch}return o};
const short=n=>{const e=(typeof D!=="undefined"&&D)&&D.entries.find(x=>x.name===n);return e&&e.short?tx(e.short):short0(tx(n))};
const tw=(s,fs)=>[...s].reduce((a,c)=>a+(/[\u0000-ɏ]/.test(c)?.58:1),0)*fs;
const nz=(t,s)=>Math.sin(t*1.7+s)*.5+Math.sin(t*3.1+s*1.9)*.3+Math.sin(t*5.3+s*2.7)*.2;
let D, pinned=null;

/* ---------- 竞争权重：资金实力与压力分（算法写在页面“压力分怎么算”里） ---------- */
const money=e=>{const f=e.funding||{};return f.kind==="project"?null:(f.total_usd||null)};
const est=e=>{const f=e.funding||{};return f.kind!=="project"&&!f.total_usd&&f.valuation_usd?f.valuation_usd/5:null};
/* 体量：用同一把尺子比较所有团队。创业公司看估值（没有估值看已披露融资），上市公司看市值，大公司项目看母公司市值。
   跨度从几百万到上万亿美元，所以用对数刻度：每多一格就是 10 倍。 */
const scaleOf=e=>{const f=e.funding||{};
  if(f.kind==="project") return f.project_investment_usd?{v:f.project_investment_usd,k:"proj"}:(f.parent_market_cap_usd?{v:f.parent_market_cap_usd,k:"parent"}:null);
  if(f.kind==="listed"&&f.valuation_usd) return {v:f.valuation_usd,k:"mcap"};
  if(f.valuation_usd) return {v:f.valuation_usd,k:"val"};
  if(f.total_usd) return {v:f.total_usd,k:"raised"};
  return null};
const LMIN=1e7, LMAX=2e12, lg=v=>Math.max(0,Math.min(1,Math.log10(v/LMIN)/Math.log10(LMAX/LMIN)));
const strength=e=>{const s=scaleOf(e); if(!s) return null; return lg(s.v)*(s.k==="parent"?.6:1)};
const sc=lg;
const GRW={A:1,B:.75,C:.5,D:.25};
function pressure(e){
  const st=strength(e), prog=(sn(e)+1)/6, act=isOn(e)?1:String(e.activity).startsWith("放缓")?.5:.2,
        fit=e.section==="adjacent"?.4:(e.fit??1), ev=Math.max(0,...(e.evidence||[]).map(x=>GRW[x.grade]||0));
  const parts={资金实力:[.30,st??.15],进度:[.25,prog],活跃度:[.15,act],方向贴合:[.20,fit],证据强度:[.10,ev]};
  return {score:Math.round(100*Object.values(parts).reduce((a,[w,v])=>a+w*v,0)),parts,known:st!=null};
}
function moneyTag(e){const s=scaleOf(e); if(!s) return L("未披露","undisclosed");
  const P={parent:L("母公司市值 ","parent mkt cap "),proj:L("项目投入 ","project "),mcap:L("市值 ","mkt cap "),val:L("估值 ","val. "),raised:L("融资 ","raised ")}[s.k];
  return P+fmt(s.v)}
/* 货币：按用户所在地区（先看时区，再看浏览器地区）显示当地货币；汇率在 data/fx.json，每天更新 */
const CURS=["USD","CAD","EUR","GBP","CNY","HKD","TWD","JPY","KRW","SGD","AUD","NZD","INR","BRL","MXN","CHF","SEK","NOK","DKK","PLN","TRY","AED","ILS","ZAR","THB","IDR","MYR","PHP","VND"];
const TZC={"America/Toronto":"CAD","America/Vancouver":"CAD","America/Edmonton":"CAD","America/Winnipeg":"CAD","America/Halifax":"CAD","America/St_Johns":"CAD","America/Regina":"CAD","America/Montreal":"CAD","Europe/London":"GBP","Europe/Zurich":"CHF","Europe/Stockholm":"SEK","Europe/Oslo":"NOK","Europe/Copenhagen":"DKK","Europe/Warsaw":"PLN","Europe/Istanbul":"TRY","Asia/Shanghai":"CNY","Asia/Chongqing":"CNY","Asia/Urumqi":"CNY","Asia/Harbin":"CNY","Asia/Hong_Kong":"HKD","Asia/Macau":"HKD","Asia/Taipei":"TWD","Asia/Tokyo":"JPY","Asia/Seoul":"KRW","Asia/Singapore":"SGD","Asia/Kolkata":"INR","Asia/Calcutta":"INR","America/Sao_Paulo":"BRL","America/Mexico_City":"MXN","Asia/Dubai":"AED","Asia/Jerusalem":"ILS","Africa/Johannesburg":"ZAR","Asia/Bangkok":"THB","Asia/Jakarta":"IDR","Asia/Kuala_Lumpur":"MYR","Asia/Manila":"PHP","Asia/Ho_Chi_Minh":"VND","Asia/Saigon":"VND","Pacific/Auckland":"NZD"};
const EUROZ=/^Europe\/(Paris|Berlin|Madrid|Rome|Amsterdam|Brussels|Vienna|Dublin|Lisbon|Helsinki|Athens|Luxembourg|Bratislava|Ljubljana|Tallinn|Riga|Vilnius|Valletta|Monaco|Zagreb)$/;
const RGC={US:"USD",CA:"CAD",GB:"GBP",IE:"EUR",FR:"EUR",DE:"EUR",ES:"EUR",IT:"EUR",NL:"EUR",BE:"EUR",AT:"EUR",PT:"EUR",FI:"EUR",GR:"EUR",CN:"CNY",HK:"HKD",TW:"TWD",JP:"JPY",KR:"KRW",SG:"SGD",AU:"AUD",NZ:"NZD",IN:"INR",BR:"BRL",MX:"MXN",CH:"CHF",SE:"SEK",NO:"NOK",DK:"DKK",PL:"PLN",TR:"TRY",AE:"AED",IL:"ILS",ZA:"ZAR",TH:"THB",ID:"IDR",MY:"MYR",PH:"PHP",VN:"VND"};
function autoCur(){ try{ const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""; if(TZC[tz]) return TZC[tz]; if(EUROZ.test(tz)) return "EUR"; if(/^Australia\//.test(tz)) return "AUD"; if(/^America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Detroit|Boise|Indiana|Kentucky)/.test(tz)||tz==="Pacific/Honolulu") return "USD"; }catch(_){}

let FX={USD:1}, FXD="", CURPREF=(()=>{try{return localStorage.getItem("vm-cur")||"auto"}catch(_){return "auto"}})();

const FXP=fetch("data/fx.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.rates){FX={USD:1,...j.rates};FXD=j.date||""}}).catch(()=>{});
const usd=v=>{const a=Math.abs(v),k=(x,u)=>`$${x>=100?Math.round(x):x>=10?x.toFixed(1).replace(/\.0$/,""):x.toFixed(2).replace(/\.?0+$/,"")}${u}`;return a>=1e12?k(v/1e12,"T"):a>=1e9?k(v/1e9,"B"):a>=1e6?k(v/1e6,"M"):k(v/1e3,"K")};
function fmt(v){if(v==null)return L("未披露","Not disclosed"); const c=CC(), x=v*(FX[c]||1);
  try{ return new Intl.NumberFormat(LOC(),{style:"currency",currency:c,notation:"compact",maximumSignificantDigits:3}).format(x) }catch(_){}
  if(LANG!=="zh")return usd(v);if(v>=1e12)return `${(v/1e12).toFixed(2)} 万亿美元`;const y=v/1e8;return y>=1?`${y>=100?Math.round(y):y.toFixed(1)} 亿美元`:v>=1e6?`${Math.round(v/1e6)} 百万美元`:`${Math.round(v/1e4)} 万美元`}
const fmtS=v=>LANG==="zh"?fmt(v).replace("美元",""):fmt(v);

/* ---------- 目标放射图：目标在圆心，每家一条从目标发散出去的直线；离目标越近，走得越远 ---------- */
const FW=1100; let FILT=new Set();
const twd=(t,fs)=>[...String(t)].reduce((a,c)=>a+(/[\u0000-ɏ]/.test(c)?.58:1),0)*fs;
const fx=v=>v.toFixed(1);
function build(d){
  const br=(d.project.branches||[]).filter(b=>d.entries.some(e=>e.branch===b.id));
  const groups=br.map(b=>d.entries.filter(e=>e.branch===b.id).sort((a,c)=>sn(c)-sn(a)||(pressure(c).score-pressure(a).score)));
  const n=d.entries.length, big=n>40, A=big?58:52, R0=big?560:500, RI=118, R=[0,1,2,3,4,5].map(i=>R0-i*(R0-RI)/5);
  const H=Math.round(2*R0*Math.sin(A*Math.PI/180)+170), cx=176, cy=H/2+18;
  const pt=(r,a)=>{const t=a*Math.PI/180;return [cx+r*Math.cos(t),cy-r*Math.sin(t)]};
  const arc=(r,a0,a1)=>{const [x0,y0]=pt(r,a0),[x1,y1]=pt(r,a1);return `M${fx(x0)} ${fx(y0)} A${r} ${r} 0 0 1 ${fx(x1)} ${fx(y1)}`};
  const gap=big?3:4, step=(2*A-gap*(groups.length-1))/Math.max(1,n-1);
  const rays=[]; let a=A; const barc=[];
  groups.forEach((g,gi)=>{const ga0=a; g.forEach(e=>{rays.push({e,a}); a-=step}); barc.push([br[gi].id,ga0,a+step]); a-=gap});
  const maxS=Math.max(0,...d.entries.map(sn)), T=TGT(d), Rz=(R[T-1]+R[T])/2;
  let MAXX=0; let s=`<svg class="map fan" id="map" viewBox="0 0 __FW__ ${H}" role="img" aria-label="${L("目标放射图：目标在左侧圆心，每个团队是一条从目标发散出去的直线，圆点越靠近目标说明走得越远；圆心附近的 S2 到 S5 是目标区间。","Goal radial map: the goal sits at the centre on the left; each team is a straight line radiating out from it. The closer a dot is to the goal, the further that team has got. The shaded zone near the centre (S2–S5) is the target zone.")}"><defs>
    <radialGradient id="tz" cx="${cx}" cy="${cy}" r="${Rz}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--goal)" stop-opacity=".22"/><stop offset=".55" stop-color="var(--goal)" stop-opacity=".09"/><stop offset="1" stop-color="var(--goal)" stop-opacity=".035"/></radialGradient>
    <radialGradient id="gh" cx="${cx}" cy="${cy}" r="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--goal)" stop-opacity=".45"/><stop offset="1" stop-color="var(--goal)" stop-opacity="0"/></radialGradient>`;
  rays.forEach((r,i)=>{const [x0,y0]=pt(0,r.a),[x1,y1]=pt(R[sn(r.e)],r.a); r.gid="rg"+i;
    s+=`<linearGradient id="rg${i}" gradientUnits="userSpaceOnUse" x1="${fx(x0)}" y1="${fx(y0)}" x2="${fx(x1)}" y2="${fx(y1)}"><stop offset="0" stop-color="var(--goal)" stop-opacity=".9"/><stop offset=".25" stop-color="var(--goal)" stop-opacity=".5"/><stop offset="1" stop-color="${LC[r.e.branch]||"var(--b1)"}" stop-opacity=".2"/></linearGradient>`});
  s+=`</defs>`;
  // 目标区间（S2–S5）
  s+=`<path d="M${cx} ${cy} L${fx(pt(Rz,A+3)[0])} ${fx(pt(Rz,A+3)[1])} A${Rz} ${Rz} 0 0 1 ${fx(pt(Rz,-A-3)[0])} ${fx(pt(Rz,-A-3)[1])} Z" fill="url(#tz)"/>`+
       `<path d="${arc(Rz,A+3,-A-3)}" fill="none" stroke="var(--goal)" stroke-width="1" opacity=".25"/>`;
  // 阶段环
  R.forEach((r,i)=>{s+=`<path d="${arc(r,A+3,-A-3)}" fill="none" stroke="var(--line)" stroke-width="1" ${i?'stroke-dasharray="2 6"':""}/>`;
    const [x,y]=pt(r,A+3); s+=`<g class="stg"><title>S${i} ${STG("S"+i)}: ${STD("S"+i)}</title><text x="${fx(x)}" y="${fx(y-22)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--soft)">S${i}</text><text x="${fx(x)}" y="${fx(y-9)}" text-anchor="middle" font-size="9.5" fill="var(--faint)">${STG("S"+i)}</text></g>`});
  const [lx0,ly0]=pt(R0+4,A+12); s+=`<text x="${fx(lx0)}" y="${fx(ly0-2)}" font-size="11" fill="var(--faint)">${L("← 离目标越近，走得越远","← closer to the goal = further along")}</text>`;
  // 目标圈：这张图要达到的阶段
  { const [fx0,fy0]=pt(R[T],-A-3); s+=`<path d="${arc(R[T],A+3,-A-3)}" fill="none" stroke="var(--goal)" stroke-width="1.6" opacity=".55"/><text x="${fx(fx0)}" y="${fx(fy0+18)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--goal)">${L("目标","Target")} · S${T}</text>`; }
  // 目标光晕：画在射线下面，射线一直连到圆心
  s+=`<circle cx="${cx}" cy="${cy}" r="70" fill="url(#gh)"/><circle class="pulse" cx="${cx}" cy="${cy}" r="16" fill="var(--goal)" opacity=".3"/>`;
  // 路线弧
  barc.forEach(([id,a0,a1])=>{s+=`<path class="blab" data-b="${esc(id)}" d="${arc(R0+9,a0+.8,a1-.8)}" fill="none" stroke="${LC[id]||"var(--b1)"}" stroke-width="3" stroke-linecap="round"/>`});
  // 标签排布：水平，太挤时上下让开
  const fs=big?9.5:12, G=fs+(big?3.5:5), BL=96;
  const LB=rays.map(r=>{const [x,y]=pt(R0+18,r.a);return {...r,ax:x,ay:y,y}});
  for(let it=0;it<240;it++) for(let i=1;i<LB.length;i++){const dd=LB[i].y-LB[i-1].y; if(dd<G){const m=(G-dd)/2; LB[i].y+=m; LB[i-1].y-=m}}
  LB.forEach(l=>{
    const e=l.e, c=LC[e.branch]||"var(--b1)", [x0,y0]=pt(R0,l.a), [x1,y1]=pt(R[sn(e)],l.a), [xg,yg]=pt(0,l.a), low=e.confidence==="低";
    const SC=scaleOf(e), v=SC&&SC.v, bl=v?BL*lg(v):0, lx=l.ax+6, ly=l.y, f=e.funding||{};
    const amt=moneyTag(e);
    s+=`<g class="who" tabindex="0" data-id="${esc(e.id)}" data-b="${esc(e.branch)}" role="button" aria-label="${esc(tx(e.name))}, ${esc(e.stage)} ${STG(e.stage)}, ${esc(amt||L("资金未披露","funding not disclosed"))}">`+
      `<line x1="${fx(xg)}" y1="${fx(yg)}" x2="${fx(x1)}" y2="${fx(y1)}" stroke="url(#${l.gid})" stroke-width="1.1" stroke-linecap="round"/>`+
      `<line class="walk" x1="${fx(x0)}" y1="${fx(y0)}" x2="${fx(x1)}" y2="${fx(y1)}" stroke="${c}" stroke-width="${big?1.6:2.2}" stroke-linecap="round"/>`+
      (isOn(e)?`<line class="flowing" x1="${fx(x0)}" y1="${fx(y0)}" x2="${fx(x1)}" y2="${fx(y1)}" stroke="var(--bg)" stroke-width="1" opacity=".45"/>`:"")+
      `<circle class="dot" cx="${fx(x1)}" cy="${fx(y1)}" r="${big?3:4.2}" fill="${low?"var(--bg)":c}" stroke="${c}" stroke-width="1.8"/>`+
      `<path d="M${fx(x0+3*Math.cos(l.a*Math.PI/180))} ${fx(y0-3*Math.sin(l.a*Math.PI/180))} L${fx(l.ax)} ${fx(l.ay)} L${fx(lx)} ${fx(ly)}" fill="none" stroke="var(--faint)" stroke-width=".8" opacity=".7"/>`+
      `<rect x="${fx(lx+4)}" y="${fx(ly-2.5)}" width="${BL}" height="5" rx="2.5" fill="var(--line)"/>`+
      [1,2,3,4,5].map(k=>k/Math.log10(LMAX/LMIN)).map(t=>`<line x1="${fx(lx+4+BL*t)}" y1="${fx(ly-2.5)}" x2="${fx(lx+4+BL*t)}" y2="${fx(ly+2.5)}" stroke="var(--bg)" stroke-width=".8"/>`).join("")+
      (v?(SC.k==="parent"
          ?`<rect x="${fx(lx+4.5)}" y="${fx(ly-2)}" width="${fx(Math.max(bl,3)-1)}" height="4" rx="2" fill="none" stroke="${c}" stroke-width="1" stroke-dasharray="2 1.5" opacity=".85"/>`
          :`<rect x="${fx(lx+4)}" y="${fx(ly-2.5)}" width="${fx(Math.max(bl,3))}" height="5" rx="2.5" fill="${c}" opacity="${SC.k==="raised"?.55:.95}"/>`):"")+
      `<text class="lab" x="${fx(lx+BL+14)}" y="${fx(ly+fs*.36)}" font-size="${fs}" fill="var(--ink)">${esc(short(e.name))}${big?"":`<tspan fill="var(--soft)" font-size="10.5">　${esc(LANG==="zh"?amt.replace("美元",""):amt)}</tspan>`}</text>`+
      `<rect x="${fx(lx)}" y="${fx(ly-G/2)}" width="${fx(BL+20+twd(short(e.name),fs)+(big?0:90))}" height="${fx(G)}" fill="transparent"/>`+(MAXX=Math.max(MAXX,lx+BL+16+twd(short(e.name)+(big?"":"　"+(LANG==="zh"?amt.replace("美元",""):amt)),fs)),"")+
      `<line x1="${fx(x0)}" y1="${fx(y0)}" x2="${fx(x1)}" y2="${fx(y1)}" stroke="transparent" stroke-width="10"/></g>`;
  });
  // 目标
  s+=`<circle cx="${cx}" cy="${cy}" r="12" fill="var(--goal)"/>`+
     `<text x="${cx-30}" y="${cy-2}" text-anchor="end" font-size="16" font-weight="700" fill="var(--goal)">${L("终点","Finish")}</text><text x="${cx-30}" y="${cy+15}" text-anchor="end" font-size="11" fill="var(--soft)">${esc(tx(d.project.goal_short||short0(d.project.goal)))}</text>`;
  return s.replace("__FW__",String(Math.round(Math.max(MAXX+70,700))))+`</svg>`;
}
const reach=d=>{const n=d.entries.filter(e=>e.section!=="adjacent"&&sn(e)>=5).length;return n?L(`${n} 家已到达`,`${n} arrived`):L("还没有团队到达","No team has arrived")};

/* ---------- 悬停卡片（只看要点）与详情抽屉（看全部证据） ---------- */
const brOf=e=>(D.project.branches||[]).find(x=>x.id===e.branch)||{};
const head=(e,big)=>{const s=sn(e),c=LC[e.branch]||"var(--b1)";return `<span class="lp"><i></i>${esc(tx(brOf(e).name||""))}</span><h3>${esc(tx(e.name))}</h3>
    <div class="where"><b>${esc(e.stage)}</b><span>${STG(e.stage)}</span><em>${s>=TGT(D)?L("已到达目标","Target reached"):L(`距目标还有 ${TGT(D)-s} 站`,`${TGT(D)-s} stage${TGT(D)-s>1?"s":""} to the goal`)}</em></div>
    <div class="seg">${[0,1,2,3,4,5].map(i=>`<span class="${i<=s?"f":""}"></span>`).join("")}<em></em></div>
    <p class="ms">${esc(tx(e.milestone))}</p>
    <div class="facts"><div><small>${L("活跃度","Activity")}</small><strong style="color:${actC(e.activity)}">${esc(actS(e.activity))}</strong></div><div><small>${L("最近进展","Last progress")}</small><strong>${esc(e.last_progress||L("未知","Unknown"))}</strong></div><div><small>${L("置信度","Confidence")}</small><strong>${esc(tx(e.confidence))}</strong></div></div>
    ${(e.flags||[]).length?`<div class="flags">${e.flags.map(f=>`<span>${esc(tx(f))}</span>`).join("")}</div>`:""}`};
const evli=(x,link)=>`<li><span class="g g-${esc(x.grade)}">${esc(x.grade)}</span><span><span class="d">${esc(x.date||L("日期不详","date unknown"))}</span>${esc(tx(x.text))}${link&&x.url?` <a href="${esc(x.url)}" target="_blank" rel="noopener">${L("来源","Source")}</a>`:""}${link&&x.quote?`<q class="oq" title="${esc(L("来源页面原文，未翻译","Verbatim from the source page, untranslated"))}">${esc(x.quote)}</q>`:""}${link&&x.verified?`<small class="ver">✓ ${L("已核对原文","Checked against source")} ${esc(x.verified)}</small>`:""}${link&&x.url&&(window.claude||repoURL())?` <button type="button" class="rpt" data-url="${esc(x.url)}" data-text="${esc(String(x.text||"").slice(0,300))}">${L("报错","Report an error")}</button>`:""}</span></li>`;
/* 准确率抽查和勘误记录：数据在 project.audit 和 corrections 里 */
function auditHTML(d){ const a=d.project&&d.project.audit; if(!a) return "";
  const pct=v=>(v*100).toFixed(1)+"%", c=a.census, v=a.acceptance;
  if(!v) return "";
  const err=v.wrong+v.unsupported, cnt=v.n-v.unreachable;
  return `<div class="audit"><h4>${L("准确率核查","Accuracy check")} <small>${esc(v.date)}</small></h4>
    <div class="anum"><div><b>${err}</b><span>${L(`验收抽查 ${cnt} 条里的错误`,`errors in an acceptance sample of ${cnt}`)}</span></div><div><b>${pct(v.minor/cnt)}</b><span>${L("有小误差（如日期差几天）","with minor slips (e.g. a date off by days)")}</span></div><div><b>≥ ${pct(v.lower95)}</b><span>${L("没有错误的比例，95% 置信下限","error-free share, 95% confidence lower bound")}</span></div></div>
    <p>${L(`做法：先随机抽 ${a.n} 条，只有 ${pct(a.accuracy)} 完全正确；于是把全部结论逐条打开原网页核对、按原文重写，并改了数据结构（里程碑直接取自带原文的证据，产品介绍和资金数字都必须写明出处）。每改一轮，就由没参与过的核查员重新随机抽 ${cnt} 条验收。`,`How: a first random sample of ${a.n} claims found only ${pct(a.accuracy)} fully correct. So every claim was checked against its original page and rewritten to match it, and the data structure changed — milestones now come straight from quoted evidence, and product descriptions and funding figures must name their sources. After each round, fresh auditors who hadn't worked on the map drew a new random sample of ${cnt}.`)} ${L(`最近一轮（第 ${v.rounds} 轮）：${err} 条错误或没有依据、${v.minor} 条小误差。`,`Latest round (round ${v.rounds}): ${err} wrong or unsupported, ${v.minor} minor slips.`)}${(v.history||[]).length?` ${L(`各轮结果：${v.history.map(h=>`第 ${h.round} 轮 ${h.wrong+(h.unsupported||0)} 错 ${h.minor} 小误差`).join('；')}。`,`All rounds: ${v.history.map(h=>`round ${h.round}: ${h.wrong+(h.unsupported||0)} wrong, ${h.minor} minor`).join('; ')}.`)}`:""}</p>
    <p class="afine">${L("标准：不允许错误或没有依据的数据；小误差不超过 4%。找不到依据的内容直接删除，不保留。","Standard: no wrong or unsupported data; minor slips at most 4%. Anything without a source is removed, not kept.")} ${err===0&&v.minor/cnt<=0.04?L("本次验收通过。","This acceptance check passed."):err===0?L(`没有错误；小误差 ${pct(v.minor/cnt)}，还没降到 4% 以内，验收未通过，会继续改进。`,`No errors; minor slips are at ${pct(v.minor/cnt)}, not yet within 4%, so the check has not passed and we keep improving.`):L("本次验收没有通过，正在继续改正。","This acceptance check did not pass; fixes are under way.")}</p>${v.note?`<p class="afine">${esc(tx(v.note))}</p>`:""}${(()=>{const w=(a.weekly||[]).slice(-1)[0]; if(!w) return `<p class="afine">${L("每周抽查：还没有记录。","Weekly spot checks: none recorded yet.")}</p>`; const we=(w.wrong||0)+(w.unsupported||0), age=Math.round((Date.parse(d.project.updated||w.date)-Date.parse(w.date))/864e5); return `<p class="afine">${L(`最近一次每周抽查（${w.date}）：${w.n} 条里 ${we} 条错误或没有依据、${w.minor||0} 条小误差，发现的问题已当天改正。`,`Latest weekly spot check (${w.date}): ${we} wrong or unsupported and ${w.minor||0} minor out of ${w.n}; problems found were fixed the same day.`)}${w.scope==="all"?" "+L("这次抽查是全部地图合计抽样。","This sample was drawn across all maps combined."):""}${age>7?L(`此后 ${age} 天没有再做每周抽查。`,` No weekly check has been run in the ${age} days since.`):""}</p>`})()}${a.note_after?`<p class="afine">${esc(tx(a.note_after))}</p>`:""}</div>`; }
function corrHTML(d){ const c=d.corrections||[]; if(!c.length) return "";
  return `<details class="more2"><summary>${L(`勘误记录（${c.length}）`,`Corrections log (${c.length})`)}</summary><ul class="corr">${c.map(x=>{const e=d.entries.find(y=>y.id===x.entry);return `<li><span class="when">${esc(x.date)}</span><div>${e?`<button class="ref" data-ref="${esc(e.id)}">${esc(short(e.name))}</button> `:""}${esc(tx(x.what))}${x.url?` <a href="${esc(x.url)}" target="_blank" rel="noopener">${L("依据","Basis")}</a>`:""}</div></li>`}).join("")}</ul></details>`; }
function tipHTML(e){
  const ev=e.evidence||[];
  return `<div style="--c:${LC[e.branch]||"var(--b1)"}">${head(e)}${e.role&&e.role.main?`<div class="trole">${L("主攻","Focus")} <b>${esc(LAYER(e.role.main))}</b>${(e.openness||[]).length?L(` · 公开了 ${(e.openness||[]).length} 项成果`,` · ${(e.openness||[]).length} public release${(e.openness||[]).length>1?"s":""}`):L(" · 没有公开成果"," · nothing public")}</div>`:""}<ul class="ev">${ev.slice(0,2).map(x=>evli(x,false)).join("")||`<li><span></span><span style="color:var(--soft)">${L("暂无证据记录","No evidence yet")}</span></li>`}</ul>

}

function gapsHTML(e){ const g=e.gaps; if(!g||!((g.field||[]).length||(g.ours||[]).length)) return (D&&D.project&&D.project.draft)?"":`<div class="gaps"><h4>${L("离目标还差什么","What's still missing")}</h4><p class="gnote">${L("待补充：这一栏还没写，每日更新会逐个补上。空着不代表没有缺口。","To be filled in: this hasn't been written yet; the daily update fills it in team by team. Empty does not mean nothing is missing.")}</p></div>`;
  const li=(x,u)=>`<li>${esc(tx(x.text||x))}${u?` <a href="${esc(u)}" target="_blank" rel="noopener">${L("依据","Basis")}</a>`:""}</li>`;
  return `<div class="gaps"><h4>${L("离目标还差什么","What's still missing")}</h4>
  ${(g.field||[]).length?`<div class="gf"><b>${L("这个团队自身还缺的","What the team itself still lacks")}</b><ul>${g.field.map(x=>li(x,x.basis_url)).join("")}</ul></div>`:""}
  ${(g.ours||[]).length?`<div class="go"><b>${L("地图还没核实的","Not yet checked by this map")}</b><ul>${g.ours.map(x=>li(x,x.url)).join("")}</ul><small>${L("这些是我们调研没做完的地方，不代表行业现状；每日更新会优先补上。","These are gaps in our own research, not in the field; the daily update fills them first.")}</small></div>`:""}</div>`;}
function gradeHTML(d){ const C={A:0,B:0,C:0,D:0}; let n=0;
  d.entries.forEach(e=>(e.evidence||[]).forEach(x=>{ if(C[x.grade]!==undefined){C[x.grade]++;n++} }));
  if(!n) return ""; const pc=k=>Math.round(C[k]/n*100);

function wireAsk(d,f){
  const ta=document.getElementById("askt"), hint=document.getElementById("askhint"), fbox=document.getElementById("files"), fin=document.getElementById("fileIn");

  /* 文件：图片直接交给 AI 看，文本类读成文字一起发 */
  let FILES=[], IMGOK=false; (async()=>{try{IMGOK=!!(ASK.limits&&(await ASK.limits()).images)}catch(_){}})();
  const TXT=/\.(txt|md|csv|tsv|json|html?)$/i;
  const drawFiles=()=>{fbox.hidden=!FILES.length; fbox.innerHTML=FILES.map((x,i)=>`<span class="fchip">${x.img?"🖼":"📄"} ${esc(x.name)}<button type="button" data-i="${i}" aria-label="${L("移除","Remove")} ${esc(x.name)}">×</button></span>`).join("");
    fbox.querySelectorAll("button").forEach(b=>b.onclick=()=>{FILES.splice(+b.dataset.i,1);drawFiles()})};
  const addFiles=async list=>{ for(const fl of list){
      if(FILES.length>=5){say(L("一次最多带 5 个文件。","Up to 5 files at a time."));break}
      if(fl.type.startsWith("image/")){ if(!IMGOK){say(L("这里暂时不能把图片交给 AI，先用文字描述吧。","Images can't be sent to AI here yet — describe it in words instead."));continue} if(fl.size>8e6){say(fl.name+L(" 太大了（超过 8 MB）。"," is too large (over 8 MB)."));continue} FILES.push({name:fl.name,img:true,blob:fl}); }
      else if(TXT.test(fl.name)||fl.type.startsWith("text/")){ if(fl.size>2e6){say(fl.name+L(" 太大了（超过 2 MB）。"," is too large (over 2 MB)."));continue} FILES.push({name:fl.name,text:(await fl.text()).slice(0,40000)}); }
      else say(fl.name+L("：目前只支持图片和文本类文件（txt、md、csv、json）。PDF 和 Word 请先复制里面的文字。",": only images and text files (txt, md, csv, json) are supported for now. For PDF or Word, paste the text instead."));

  f.addEventListener("dragleave",()=>f.classList.remove("drag"));
  f.addEventListener("drop",e=>{e.preventDefault(); f.classList.remove("drag"); addFiles([...e.dataTransfer.files])});
  ta.addEventListener("paste",e=>{const fs=[...(e.clipboardData||{}).files||[]]; if(fs.length){e.preventDefault(); addFiles(fs)}});

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=document.getElementById("mic");
  if(SR){ mic.hidden=false; let rec=null, base="";
    mic.onclick=()=>{ if(rec){rec.stop();return}
      rec=new SR(); rec.lang=LOC(); rec.interimResults=true; rec.continuous=true; base=ta.value; mic.classList.add("on"); say(L("正在听…再点一次麦克风结束","Listening… tap the mic again to stop"));
      rec.onresult=ev=>{let t="";for(const r of ev.results) t+=r[0].transcript; ta.value=base+t; ta.dispatchEvent(new Event("input"))};
      rec.onerror=ev=>{say(ev.error==="not-allowed"||ev.error==="service-not-allowed"?L("这个页面没有拿到麦克风权限。可以用系统自带的听写（Mac 连按两下 Fn 键，Windows 按 Win+H）。","This page has no microphone permission. Use your system's dictation instead (Mac: press Fn twice; Windows: Win+H)."):L("语音识别出错了，再试一次。","Speech recognition failed — try again."))};
      rec.onend=()=>{mic.classList.remove("on"); rec=null; if(/^(正在听|Listening)/.test(hint.textContent)) say("")};
      try{rec.start()}catch(_){mic.classList.remove("on"); rec=null; say(L("语音识别没有启动，可以用系统自带的听写。","Speech recognition didn't start; use your system's dictation instead."))}
    };
  }

    const txt=att.filter(x=>x.text).map(x=>L(`【文件 ${x.name}】`,`[File ${x.name}]`)+`\n${x.text}`).join("\n\n"), imgs=att.filter(x=>x.img).map(x=>x.blob);
    try{ const r=await ASK(LANG==="zh"?`${RULES_ZH}\n如果用户写的是一个想法而不是问题，先用一句话复述，再说这张图里谁在做相近的事、能借鉴什么、要注意什么。用户附了文件时，先读文件，再结合这张图回答。\n\n数据：${ctxData(d,curGoal())}\n\n${hist?"之前的对话：\n"+hist+"\n\n":""}${txt?"用户附的文件：\n"+txt+"\n\n":""}用户现在说：${shown}`:`${RULES_X()}\nIf the user writes an idea rather than a question, restate it in one sentence, then say who on this map is doing something similar, what can be reused, and what to watch out for. If files are attached, read them first, then answer together with the map.\n\nData: ${ctxData(d,curGoal())}\n\n${hist?"Earlier conversation:\n"+hist+"\n\n":""}${txt?"Attached files:\n"+txt+"\n\n":""}The user now says: ${shown}`,{onText:({text})=>{ap.textContent=text},modelTier:"default",cache:false,...(imgs.length?{images:imgs}:{})});
      it.a=r.text; ap.textContent=r.text; }
    catch(err){ it.a=""; ap.textContent=err&&err.code==="rate_limited"?L("问得太快了，过一会儿再试。","Too many questions too fast — try again in a moment."):err&&err.code==="not_granted"?L("没有获得使用 AI 的许可。想法仍会保存，下一次每日刷新时一并调研。","AI access wasn't granted. Your idea is still saved and will be researched at the next daily refresh."):L("AI 暂时没有回应，想法已保存，稍后再试。","AI didn't respond. Your idea is saved — try again later."); }
    el.classList.remove("live"); busy=false;
    HIST.push({q:it.q,a:it.a}); HIST=HIST.slice(-3);
    if(DB){ try{ const ref=DB.collection("ideas").doc(); await ref.set({q:it.q,a:it.a,at:new Date().toISOString(),queued:false,files:names}); it.id=ref.id; }catch(_){} }
  });

const getJ=(u,fb)=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).catch(e=>{if(fb!==undefined)return fb;throw e});
function pickMap(){ let q=null; try{q=new URLSearchParams(location.search).get("map")||localStorage.getItem("vm-map")}catch(_){}
  return MAPS.find(m=>m.id===q)||MAPS[0]; }
function loadMap(m){
  CUR=m; try{localStorage.setItem("vm-map",m.id)}catch(_){}
  return Promise.all([getJ(m.map),getJ(m.en||"data/en.json",{}),XL&&Object.keys(XL).length||LANG==="en"||LANG==="zh"?null:loadXL(),FXP,getJ(m.promises||(m.map==="data/map.json"?"data/promises.json":m.map.replace(/map\.json$/,"promises.json")),null),getJ(m.signals||(m.map==="data/map.json"?"data/signals.json":m.map.replace(/map\.json$/,"signals.json")),null)]).then(([d,en,_x,_f,pr,sg])=>{EN=en&&typeof en==="object"?en:{}; PROM=pr&&pr.teams?pr:null; SIG=sg&&sg.teams?sg:null; SEEN=null; markSeen(d); render(d)});
}
(window.claude?getJ("data/compare.json",null):Promise.resolve(null)).then(c=>{CMP=c&&c.ai?c:null; if(CMP&&D) render(D)});
(window.claude?getJ("data/human_audit.json",null):Promise.resolve(null)).then(h=>{HA=h&&h.maps?h:null; if(HA&&D&&!(CUR&&CUR.draft)) render(D)});
getJ("data/maps.json",{maps:[]}).then(r=>{ REPO=r&&r.repo||null; MAPS=(r&&r.maps||[]).filter(m=>m&&m.id&&m.map); if(!MAPS.length) MAPS=[{id:"map",map:"data/map.json",en:"data/en.json",title:"地图",title_en:"Map"}]; return loadMap(pickMap()); })
 .catch(e=>{document.getElementById("app").innerHTML=`<p class="err">${L("进度数据没有载入","The map data didn't load")} (${esc(e.message)}). ${L("刷新页面再试；如果仍然失败，说明地图数据缺失或格式有误。","Refresh to try again; if it still fails, the map data is missing or malformed.")}</p>`});
document.addEventListener("change",ev=>{ if(ev.target&&ev.target.id==="mapsw"&&ev.target.value.startsWith("draft:")){ const r=DRAFTS().find(x=>"draft:"+x.id===ev.target.value); if(r){showDraft(r); scrollTo(0,0)} return; }
  if(ev.target&&ev.target.id==="mapsw"){ const m=MAPS.find(x=>x.id===ev.target.value); if(m) loadMap(m).then(()=>scrollTo(0,0)); } });
</script>
