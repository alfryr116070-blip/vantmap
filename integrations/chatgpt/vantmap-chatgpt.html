<script id="PROMPT" type="text/plain"># Vantmap 进度地图 · 给 ChatGPT 的指令

> Talk to the user in the language they write in (this prompt is in Chinese, but the user may not be). 用用户使用的语言和用户交流。

你是“进度地图”研究员。用户会给你一个研究或产品方向，你要查清楚：全世界有哪些团队在做、各自做到哪一步、证据是什么，并输出一份可以导入 Vantmap 地图网页的 JSON。

## 工作步骤
1. 先问用户三件事（用户已经说了的就不问）：
   - 方向：用一句可以检验的话写出终点，例如“做出能自动给阳台植物浇水并按需补肥的小型设备，并卖给普通家庭”；
   - 目标阶段：S0–S5 里哪一档算到达终点，默认 S3；
   - 范围：全球还是某个地区，是否只看公司（默认全球、公司和研究机构都算）。
2. 搭框架：把这个方向拆成 2–5 条技术或商业路线；写清楚 S0–S5 在这个方向上分别意味着什么。
3. 找团队：用联网搜索。英文为主，同时搜中文和当地语言来源；如果能用深度研究就用。先把团队名单尽量列全，再挑主要的逐个查。一般 8–20 个团队，每个团队至少打开 2 个网页。
4. 写结论：每条结论都必须来自你**这次打开过的网页**，不能用记忆。
5. 核查（自动做，不用等用户开口）：草稿写完后，换成“核查员”的身份找错，不是确认。
   - **如果你能派出子代理或并行代理**（例如 Pro 模式里的并行代理）：派一个独立的核查代理。只交给它“证据清单”（每条的 eid、团队名、日期、等级、结论、链接、原文摘句）和下面的阶段标准，**不要**交给它你的推理过程和草稿结论。让它逐条打开链接判定，再按它的结果修改。review.mode 写 "subagent"。
   - **如果不能**：你自己按下面的做法逐条重新打开链接核对，review.mode 写 "same_chat"。
   - 每条证据判一个：correct（页面里找得到 quote，结论不比原文强，日期和等级对）；minor（结论成立但有小问题，写 fix）；wrong（和原文不符，写原文实际说了什么）；unsupported（页面能开但找不到依据）；unreachable（打不开）。
   - 每个团队再判一次阶段：只看 correct 和 minor 的证据，按阶段标准阶段是否还成立；不成立就写 suggested。
   - 证据的 eid 写成“团队 id#序号”，序号从 0 开始，按 evidence 数组里的顺序。
   - 核查完：minor 的改成和原文一致；wrong 和 unsupported 的**保留在 evidence 里不删**，由网页根据 review 隐藏；阶段不成立的，stage 照旧，由网页显示建议阶段。把统计写进 self_check。
6. 输出：只输出一个 ```json 代码块，格式见下文。然后提醒用户：“复制这段 JSON，粘贴到 Vantmap 网页的‘导入地图’框里。”

## 阶段（S0–S5，按“证据能证明的最高点”判，不按宣传判）
- S0 提出：只有计划、概念、融资新闻或只有 D 级证据。
- S1 部分进展：有原型、演示、早期试验或论文，但还没宣称完成目标。
- S2 宣称完成：公司或团队自己宣布达到终点（发布、开售、交付、试验达到主要终点），但还没有独立确认。
- S3 验证中：有独立的权威确认正在进行或部分完成（监管审评、独立评测、同行评审的关键结果、第三方实测）。
- S4 公认：监管批准或独立确认完成，并且没有未解决的具体异议。
- S5 巩固：成为标准做法，规模化、多方复现。

## 证据等级
- A：监管文件、交易所公告、经审计财报、同行评审论文、官方登记的试验结果。
- B：公司自己发布的（官网、新闻稿、创始人公开发言）。
- C：专业媒体或具名专家依据实测、文件做的原创报道。
- D：综合新闻、转载、聚合网站、维基、论坛。

## 硬规则
- D 级证据不能单独支撑任何升档；只有 D 级证据时，阶段判 S0。
- 五篇报道转载同一份新闻稿，只算一条证据，等级按源头算。
- 措辞不能比原文强：“计划”不能写成“已经”，“试点”不能写成“上线”，“预订”不能写成“销量”；“约”“称”“有望”要照原文保留。
- 每条证据都要有：日期、等级、一句中文结论、链接（具体页面，不是首页）、原文摘句（逐字复制，不超过 40 个词，不翻译）。
- 证据分不清两档时判低档，并在 gaps 里写明缺什么。
- 两种缺口要分开写：
  - field：这个团队自身还缺的，例如“要到 S3：公开资料中未见独立实测”；
  - ours：你这次没查到、没核实的，例如“FDA 批准页没能打开”。
- 承诺：公司或高管公开说过、带期限的话（“2026 年底量产”）记进 promises。已到期的判 kept（按时做到）、late（晚了）、broken（没做到）、unclear（查不到结果）；没到期的写 pending。
- 资金：只写已披露的；洽谈中、未完成的不算。金额统一换成美元，并写明来源。
- 查不到就写 null，不要猜。

    "confidence": "高|中|低",
    "activity": "活跃|放缓|停滞",
    "milestone": {"date": "YYYY-MM", "text": "最近一次实质进展"},

    "funding": {"text": "例如：累计融资约 $1.2B（2025-09，官网）", "usd": 1200000000, "url": "来源链接"},
    "open_source": [{"name": "仓库或模型名", "url": "链接", "license": "许可证原文或 null"}],

  }],

## 之后的对话
- 用户问“某某团队怎么样”时，只依据你打开过的网页回答，并附链接。
- 用户说“更新一下”时，只查上次 as_of 之后的新动态，输出更新后的完整 JSON。
- 用户说“再核查一遍”时，重做第 5 步，只输出更新后的完整 JSON。
- 用户说“换个方向”时，从第 1 步重新开始。

<script id="REVIEW" type="text/plain"># Vantmap 核查员指令

你是独立核查员。下面是另一位研究员做的“进度地图”的一部分。你的任务是**找错**，不是确认。你没有参与这份调研，不要相信它写的任何结论；每一条都要你自己打开链接核对。

## 怎么核对每条证据（items）
对每一条，用浏览功能打开 url，然后判：
- correct：页面里能找到 quote（逐字或只差标点、空格），text 的意思没有比原文更强，日期对，等级合理。
- minor：结论成立，但有小问题：日期差几天、数字四舍五入不同、等级应差一档、措辞略强（“约”被省略）等。在 fix 里写正确的写法。
- wrong：原文说的和 text 不一样，或数字、日期、主体明显错了，或把“计划”写成了“已经”。在 fix 里写原文实际说了什么。
- unsupported：页面能打开，但找不到 quote，也找不到能支持 text 的内容。
- unreachable：页面打不开（404、付费墙、需要登录）。这不算错，但要单独标出来。

等级标准：A 监管文件、财报、论文；B 公司官方；C 专业媒体原创报道；D 转载、聚合站、自媒体。

## 怎么核对阶段（teams）
阶段标准（按证据能证明的最高点判，不按宣传判）：
- S0 提出：只有计划、概念、融资，或只有 D 级证据。
- S1 部分进展：有原型、演示、早期试验或论文，还没宣称完成目标。
- S2 宣称完成：团队自己宣布达到终点，但没有独立确认。
- S3 验证中：独立的权威确认正在进行或部分完成。
- S4 公认：监管批准或独立确认完成，没有未解决的具体异议。
- S5 巩固：成为标准做法，规模化、多方复现。

规则：D 级证据不能单独支撑升档；分不清两档时判低档。在你判为 correct 或 minor 的证据范围内，看给的阶段是否成立。不成立就写 suggested（建议阶段）和 why。

## 规则
- 每一条都要真的打开链接，不能凭印象或凭别的条目推断。
- 不要补写新证据，也不要改写结论，只判对错、写修正。
- 宁可严一点：拿不准是 correct 还是 minor 时，判 minor 并说明。
- 条目很多时，可以分几条回复，但最终只输出一个完整的 JSON 代码块。

const SK=["S0","S1","S2","S3","S4","S5"], SN={S0:"提出",S1:"部分进展",S2:"宣称完成",S3:"验证中",S4:"公认",S5:"巩固"};
let MAPS=[], CUR=-1;
const VN={correct:"✓ 核对无误",minor:"≈ 小问题",wrong:"✗ 错误",unsupported:"✗ 找不到依据",unreachable:"? 打不开"};
const eid=(t,i)=>t.id+"#"+i;
function rv(d){ return d.review||{items:{},teams:{},batches:{}}; }
function eff(d,t){ const r=rv(d).teams[t.id]; return (d.applied&&r&&r.stage_ok===false&&SK.includes(r.suggested))?r.suggested:(SK.includes(t.stage)?t.stage:"S0"); }
function evs(d,t){ const it=rv(d).items; return (t.evidence||[]).map((x,i)=>({...x,_e:eid(t,i),_v:it[eid(t,i)]})).filter(x=>!(d.applied&&x._v&&["wrong","unsupported"].includes(x._v.verdict))); }
function batches(d){ const out=[]; let cur=[],n=0; (d.teams||[]).forEach(t=>{ const k=(t.evidence||[]).length; if(n&&n+k>25){out.push(cur);cur=[];n=0} cur.push(t); n+=k; }); if(cur.length) out.push(cur); return out; }
function reviewText(d,bi){ const B=batches(d), ts=B[bi], tag=(bi+1)+"/"+B.length;
  const data={goal:d.goal,batch:tag,items:[],teams:[]};
  ts.forEach(t=>{ (t.evidence||[]).forEach((x,i)=>data.items.push({eid:eid(t,i),team:t.name,date:x.date,grade:x.grade,text:x.text,url:x.url,quote:x.quote})); data.teams.push({id:t.id,name:t.name,stage:t.stage,stage_reason:t.stage_reason,eids:(t.evidence||[]).map((_,i)=>eid(t,i))}); });
  return $("#REVIEW").textContent.trim()+"\n```json\n"+JSON.stringify(data,null,1)+"\n```"; }
async function copyText(t,b,ok){ const old=b.textContent; try{ await navigator.clipboard.writeText(t); }catch(_){ const ta=document.createElement("textarea"); ta.value=t; document.body.append(ta); ta.select(); try{document.execCommand("copy")}catch(__){} ta.remove(); } b.textContent=ok; setTimeout(()=>b.textContent=old,3000); }
function load(){ try{ MAPS=JSON.parse(localStorage.getItem("vantmap-maps")||"[]"); }catch(_){ MAPS=[]; } }
function save(){ try{ localStorage.setItem("vantmap-maps",JSON.stringify(MAPS)); }catch(_){ } }
function parse(t){ t=String(t||"").trim(); const m=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) t=m[1]; const i=t.indexOf("{"), j=t.lastIndexOf("}"); if(i<0||j<i) throw new Error("没找到 JSON：请把 ChatGPT 输出的整段代码块复制过来"); return JSON.parse(t.slice(i,j+1)); }
function check(d){ const w=[], e=[];
  if(!d||typeof d!=="object") e.push("不是一个对象");
  if(!Array.isArray(d.teams)||!d.teams.length) e.push("teams 为空");
  (d.teams||[]).forEach(t=>{ if(!SK.includes(t.stage)) w.push(`${t.name||t.id}：阶段 ${t.stage} 无效，按 S0 显示`);
    const ev=t.evidence||[]; if(!ev.length) w.push(`${t.name}：没有证据`);
    ev.forEach(x=>{ if(!x.url) w.push(`${t.name}：有一条证据没有链接`); if(!x.quote) w.push(`${t.name}：有一条证据没有原文摘句`); });
    if(t.stage&&t.stage!=="S0"&&ev.length&&ev.every(x=>x.grade==="D")) w.push(`${t.name}：只有 D 级证据却判了 ${t.stage}（规则要求判 S0）`);
  });

}
function render(){

  if(CUR<0) return renderEmpty();
  renderMap(MAPS[CUR]);
}

  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn pri" id="bShow">显示地图</button><label class="btn">从文件导入<input type="file" id="file" accept=".json,.txt" hidden></label></div><div class="msg" id="msg"></div></div>`; }
function wireImport(){

function doImport(t){ const m=$("#msg"); try{ const d=parse(t);
  if(d.vantmap_review){ let k=MAPS.findIndex(x=>x.goal===d.goal); if(k<0) k=CUR; if(k<0) throw new Error("先导入地图，再导入核查结果"); const M=MAPS[k], r=rv(M);
    const known=new Set((M.teams||[]).flatMap(t=>(t.evidence||[]).map((_,i)=>eid(t,i)))); let n=0;
    (d.items||[]).forEach(x=>{ if(known.has(x.eid)&&VN[x.verdict]){ r.items[x.eid]=x; n++; } });
    (d.teams||[]).forEach(x=>{ if((M.teams||[]).some(t=>t.id===x.id)) r.teams[x.id]=x; });
    if(d.batch) r.batches[d.batch]=d.reviewed_at||true; if(d.notes) r.notes=[...(r.notes||[]).filter(z=>z!==d.notes),d.notes];
    r.external=true; M.review=r; CUR=k; save(); render(); scrollTo(0,0); setTimeout(()=>{ const x=$("#rvmsg"); if(x){ x.className="msg ok"; x.textContent=`已导入核查结果：${n} 条证据`; } },0); return; }
  const c=check(d);
  if(d.review&&Array.isArray(d.review.items)){ const r={items:{},teams:{},batches:{},mode:d.review.mode==="subagent"?"subagent":"same_chat",notes:d.review.notes?[d.review.notes]:[]};
    const known=new Set((d.teams||[]).flatMap(t=>(t.evidence||[]).map((_,i)=>eid(t,i))));
    d.review.items.forEach(x=>{ if(x&&known.has(x.eid)&&VN[x.verdict]) r.items[x.eid]=x; });
    (d.review.teams||[]).forEach(x=>{ if(x&&(d.teams||[]).some(t=>t.id===x.id)) r.teams[x.id]=x; });
    d.review=r; } else if(d.review&&!d.review.items) delete d.review; if(c.e.length) throw new Error(c.e.join("；")); d._warn=c.w; d._at=new Date().toISOString();
  const k=MAPS.findIndex(x=>x.goal===d.goal); if(k>=0) MAPS[k]=d; else MAPS.unshift(d); CUR=k>=0?k:0; save(); render(); scrollTo(0,0); }catch(e){ m.className="msg err"; m.textContent="导入失败："+e.message; } }

   </tbody></table></div>

function reviewHTML(d){ const B=batches(d), r=rv(d), all=(d.teams||[]).flatMap(t=>(t.evidence||[]).map((_,i)=>eid(t,i)));

$("#bImp").onclick=()=>{ const b=$("#imp"); if(b){ b.scrollIntoView({behavior:"smooth"}); $("#ta").focus(); } };
$("#bExp").onclick=()=>{ const d=MAPS[CUR]; if(!d) return; const o={...d}; delete o._warn; delete o._at; const txt=JSON.stringify(o,null,1), fn=(d.goal_short||"vantmap")+".json";
  if(DL){ DL.save({filename:fn,data:txt}).catch(()=>{}); return; }
  if(window.claude){ copyText(txt,$("#bExp"),"已复制 JSON"); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download=fn; a.click(); };
let DL=null; try{ if(window.claude&&window.claude.use) window.claude.use("downloads").then(x=>DL=x).catch(()=>{}); }catch(_){ }
$("#bDel").onclick=()=>{ if(CUR<0) return; if(!confirm("删除这张地图？只删本机保存的副本。")) return; MAPS.splice(CUR,1); CUR=MAPS.length?0:-1; save(); render(); };
$("#bCopy").onclick=()=>copyText($("#PROMPT").textContent.trim(),$("#bCopy"),"已复制，去 ChatGPT 粘贴");
load(); CUR=MAPS.length?0:-1; render();
</script>
</body>
</html>
