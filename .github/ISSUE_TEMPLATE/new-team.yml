name: New team
description: Suggest a team that belongs on a map
labels: [new-team]
body:
  - type: input
    id: map
    attributes: { label: Map }
    validations: { required: true }
  - type: input
    id: name
    attributes: { label: Team / project name }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: "Best source link (official page, paper, filing)" }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: "Why it belongs (one or two lines)" }
